name: Fix and Clean Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-project:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Check current structure
      run: |
        echo "📋 Current directory structure:"
        ls -la
        echo ""
        echo " Checking for auto-parts-inventory folder..."
        if [ -d "auto-parts-inventory" ]; then
          echo "✅ Found auto-parts-inventory directory"
          echo "Contents:"
          ls -la auto-parts-inventory/
        else
          echo "❌ auto-parts-inventory directory not found"
        fi
    
    - name: Check if it's a git submodule
      id: submodule-check
      run: |
        if [ -f ".gitmodules" ]; then
          echo "✅ Found .gitmodules file"
          cat .gitmodules
          echo "is_submodule=true" >> $GITHUB_OUTPUT
        else
          echo "❌ No .gitmodules file"
          echo "is_submodule=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Remove submodule if exists
      if: steps.submodule-check.outputs.is_submodule == 'true'
      run: |
        echo "🗑️ Removing submodule configuration..."
        
        # Remove submodule section from .gitmodules
        git config -f .gitmodules --remove-section submodule.auto-parts-inventory || true
        
        # Remove submodule
        git rm --cached auto-parts-inventory
        
        # Remove from .git/config
        git config --remove-section submodule.auto-parts-inventory || true
        
        # Commit changes
        git add .gitmodules
        git commit -m "Remove submodule configuration" || echo "No changes to commit"
    
    - name: Delete auto-parts-inventory folder
      run: |
        echo "🗑️ Deleting auto-parts-inventory folder..."
        
        if [ -d "auto-parts-inventory" ]; then
          rm -rf auto-parts-inventory
          echo "✅ Folder deleted successfully"
        else
          echo "️ Folder does not exist, skipping deletion"
        fi
    
    - name: Verify deletion
      run: |
        echo "📋 Verifying structure after deletion:"
        ls -la
        
        if [ -d "auto-parts-inventory" ]; then
          echo "❌ ERROR: Folder still exists!"
          exit 1
        else
          echo "✅ Folder successfully removed"
        fi
    
    - name: Check if project files are in correct location
      run: |
        echo " Checking for essential files:"
        
        files_ok=true
        
        if [ -f "settings.gradle.kts" ]; then
          echo "✅ settings.gradle.kts found"
        else
          echo "❌ settings.gradle.kts NOT found"
          files_ok=false
        fi
        
        if [ -f "build.gradle.kts" ]; then
          echo "✅ build.gradle.kts found"
        else
          echo "❌ build.gradle.kts NOT found"
          files_ok=false
        fi
        
        if [ -f "gradlew" ]; then
          echo "✅ gradlew found"
        else
          echo "❌ gradlew NOT found"
          files_ok=false
        fi
        
        if [ -d "app" ]; then
          echo "✅ app/ directory found"
        else
          echo "❌ app/ directory NOT found"
          files_ok=false
        fi
        
        if [ "$files_ok" = false ]; then
          echo ""
          echo "⚠️  WARNING: Essential files are missing!"
          echo "You may need to re-run the setup script."
        fi
    
    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git add -A
        
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit"
        else
          git commit -m "Fix: Remove auto-parts-inventory folder and clean structure"
          git push
          echo "✅ Changes pushed successfully"
        fi
    
    - name: Final verification
      run: |
        echo ""
        echo "========================================="
        echo "🎉 Project structure verification:"
        echo "========================================="
        echo ""
        echo "📁 Root files:"
        ls -la | grep -E "\.(kts|properties|xml|bat)$"
        echo ""
        echo " Directories:"
        ls -la | grep "^d" | awk '{print $9}'
        echo ""
        echo "✅ Cleanup completed successfully!"
        echo "========================================="

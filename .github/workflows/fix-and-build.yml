name: Fix Import Keyword and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    
    - name: Fix 'import' keyword issue
      run: |
        echo "🔄 Renaming feature/import to feature/importer..."
        if [ -d "feature/import" ]; then
          mv feature/import feature/importer
          echo "✅ Folder renamed"
        fi
        
        echo "🔄 Updating settings.gradle.kts..."
        sed -i 's/:feature:import/:feature:importer/g' settings.gradle.kts
        
        echo "🔄 Updating app/build.gradle.kts..."
        sed -i 's/:feature:import/:feature:importer/g' app/build.gradle.kts
        
        echo "🔄 Updating feature/importer/build.gradle.kts..."
        if [ -f "feature/importer/build.gradle.kts" ]; then
          sed -i 's/com\.autoparts\.inventory\.feature\.import\b/com.autoparts.inventory.feature.importer/g' feature/importer/build.gradle.kts
        fi
        
        echo "🔄 Updating Kotlin files..."
        find feature/importer -name "*.kt" -exec sed -i 's/package com\.autoparts\.inventory\.feature\.import\b/package com.autoparts.inventory.feature.importer/g' {} \;
        find feature/importer -name "*.kt" -exec sed -i 's/com\.autoparts\.inventory\.feature\.import\b/com.autoparts.inventory.feature.importer/g' {} \;

    - name: Commit and push fixes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -A
        git commit -m "fix: rename 'import' to 'importer' to resolve Java keyword conflict" || echo "No changes to commit"
        git push
        echo "✅ Fixes pushed to repository!"

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        echo "🔨 Building Debug APK..."
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Build Release APK
      run: |
        echo "🔨 Building Release APK..."
        ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload Release APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: error
